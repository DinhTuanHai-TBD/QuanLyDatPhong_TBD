name: room-booking-platform

services:
  api:
    build:
      context: ./backend
      dockerfile: src/QuanLyDatPhong_TBD.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=aws-0-ap-northeast-2.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.jpijxwxsoxrmssosgblj;Password=${SUPABASE_DB_PASSWORD:-Hahai171225@};SSL Mode=Require;Trust Server Certificate=true
      Database__InitializeOnStartup: "false"
      Jwt__Issuer: QuanLyDatPhong_TBD
      Jwt__Audience: QuanLyDatPhong_TBD_Frontend
      Jwt__SecretKey: ${JWT_SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32_CHARS}
      Jwt__ExpirationMinutes: 120
    ports:
      - "7000:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "8080:80"

